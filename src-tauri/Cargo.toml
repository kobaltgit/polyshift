[package]
name = "polyshift"
version = "2.0.0"
description = "PolyShift - Fast AI-powered Language Companion for Windows (Rust + Tauri v2 + Svelte 5)"
authors = ["kobalt"]
edition = "2021"

[lib]
name = "polyshift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
winreg = "0.52"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }
